[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamaha-serial"
version = "0.1.0"
description = "Portable RS-232 serial controller, REST API, and Web UI for the Yamaha RX-Z1 AV Receiver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
yamaha-serial = "yamaha_serial.main:run"
